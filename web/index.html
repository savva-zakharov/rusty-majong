<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <title>RUSTY-MAJONG</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }
        canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            outline: none;
            image-rendering: pixelated;
            background: #000;
            /* No browser panning/zooming/long-press menus: touches go to the game. */
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* "Rotate to landscape" hint: only on touch screens held upright.
           It fills the empty band above the board (the 560x315 game is
           56.25vw tall when it fits the width) and never blocks touches. */
        #rotate-hint {
            display: none;
            position: absolute;
            left: 0;
            right: 0;
            top: 0;
            height: calc((100% - 56.25vw) / 2);
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
            pointer-events: none;
            font: bold 14px/1.6 "Courier New", Courier, monospace;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #2ED86A;
            text-align: center;
        }
        @media (orientation: portrait) and (pointer: coarse) {
            #rotate-hint { display: flex; }
        }
        #rotate-hint .prompt { color: #FFB000; }
        #rotate-hint .dim { color: #176C35; }
        #rotate-hint .cursor { animation: blink 1s steps(1) infinite; }
        #rotate-hint .phone {
            width: 20px;
            height: 34px;
            border: 3px solid #2ED86A;
            border-radius: 3px;
            box-shadow: inset 0 -5px 0 -2px #176C35;
            animation: turn 2.4s ease-in-out infinite;
        }
        @keyframes blink { 50% { opacity: 0; } }
        @keyframes turn {
            0%, 25% { transform: rotate(0deg); }
            50%, 85% { transform: rotate(-90deg); border-color: #FFB000; }
            100% { transform: rotate(0deg); }
        }
    </style>
</head>
<body>
    <canvas id="glcanvas" tabindex="1" autofocus></canvas>
    <div id="rotate-hint" aria-live="polite">
        <div class="phone"></div>
        <div>
            <span class="prompt">&gt;</span> ROTATE TO LANDSCAPE<span class="cursor">&#9608;</span><br>
            <span class="dim">FOR A BIGGER BOARD</span>
        </div>
    </div>
    <!-- miniquad's WebGL/wasm loader, vendored from the miniquad 0.4.11 crate (js/gl.js).
         Re-copy it if the miniquad version in Cargo.lock changes. -->
    <script src="gl.js"></script>
    <!-- quad-snd's Web Audio plugin (sound effects), vendored from quad-snd 0.2.8 (js/audio.js).
         Must load after gl.js and before load(). -->
    <script src="audio.js"></script>
    <!-- Daily challenge leaderboard requests (src/net.rs). Must load after gl.js and before load(). -->
    <script src="net.js"></script>
    <script>
        load("rusty-majong.wasm");
        // Keep keyboard focus on the game so the hotkeys work after clicking.
        // (gl.js already declares a global `canvas`, so use another name.)
        const gameCanvas = document.getElementById("glcanvas");
        gameCanvas.focus();
        gameCanvas.addEventListener("pointerdown", () => gameCanvas.focus());
    </script>
</body>
</html>
