# Builds Windows, Linux and Android releases whenever a tag is pushed, and
# attaches them to a GitHub release named after the tag:
#
#   git tag v0.4
#   git push origin v0.4
#
# Each build is a separate job, so one failing (say Android) doesn't stop the
# others from being published.
name: release

on:
  push:
    tags: ["*"]
  workflow_dispatch: # run by hand from the Actions tab (builds, no release)

permissions:
  contents: write # create the release and upload files to it

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - name: Package
        shell: bash
        run: |
          name="rusty-majong-${GITHUB_REF_NAME}-windows-x64"
          mkdir -p "pkg/$name"
          cp target/release/rusty-majong.exe README.md "pkg/$name/"
          cp -r assets "pkg/$name/"
          find "pkg/$name" -name '*.psd' -delete
          (cd pkg && 7z a "../$name.zip" "$name" > /dev/null)
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: rusty-majong-*-windows-x64.zip

  linux:
    runs-on: ubuntu-22.04 # older glibc, so the binary runs on more distros
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxi-dev libgl1-mesa-dev
      - run: cargo build --release
      - name: Package
        run: |
          name="rusty-majong-${GITHUB_REF_NAME}-linux-x64"
          mkdir -p "pkg/$name"
          cp target/release/rusty-majong README.md "pkg/$name/"
          cp -r assets "pkg/$name/"
          find "pkg/$name" -name '*.psd' -delete
          tar -czf "$name.tar.gz" -C pkg "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: rusty-majong-*-linux-x64.tar.gz

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage APK assets
        # The APK's asset root is android/apk-assets (see Cargo.toml); the game
        # reads assets/..., so the art goes in an assets/ folder inside it.
        run: |
          mkdir -p android/apk-assets
          cp -r assets android/apk-assets/assets
          find android/apk-assets -name '*.psd' -delete
      - name: Build APK
        # notfl3/cargo-apk is macroquad's Android build image: Android SDK,
        # NDK and cargo-quad-apk. Update its Rust first, in case it's older
        # than this code needs. cargo-quad-apk reads Cargo.lock with an older
        # Cargo that only knows lock file version 3; for crates.io-only
        # dependencies, versions 3 and 4 are otherwise the same.
        run: |
          sed -i 's/^version = 4$/version = 3/' Cargo.lock
          docker run --rm -v "$PWD":/root/src -w /root/src notfl3/cargo-apk bash -c '
            set -e
            rustup update stable && rustup default stable
            rustup target add armv7-linux-androideabi aarch64-linux-android
            cargo quad-apk build --release
          '
      - name: Sign APK
        # cargo-quad-apk leaves release APKs unsigned, and Android only installs
        # signed ones. With the ANDROID_KEYSTORE (base64 of a .jks file) and
        # ANDROID_KEYSTORE_PASSWORD repository secrets set, every build is
        # signed with that key, so new versions install over old ones. Without
        # them, a throwaway key is made for this run: the APK installs, but
        # updating from another build means uninstalling first.
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          apk=$(find target -name '*.apk' -path '*release*' | head -n 1)
          test -n "$apk"
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > signing.jks
            pass="$KEYSTORE_PASS"
          else
            echo "::warning::No ANDROID_KEYSTORE secret: signing with a throwaway key."
            pass=android
            keytool -genkeypair -keystore signing.jks -storepass "$pass" -keypass "$pass" \
              -alias rusty-majong -dname "CN=Rusty Majong" -keyalg RSA -keysize 2048 -validity 10000
          fi
          "$bt/zipalign" -f -p 4 "$apk" aligned.apk
          out="rusty-majong-${GITHUB_REF_NAME}-android.apk"
          "$bt/apksigner" sign --ks signing.jks --ks-pass "pass:$pass" --key-pass "pass:$pass" --out "$out" aligned.apk
          "$bt/apksigner" verify --print-certs "$out"
          rm signing.jks
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: rusty-majong-*-android.apk

  release:
    # Publish whatever built, as long as the run wasn't cancelled.
    needs: [windows, linux, android]
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -l dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
